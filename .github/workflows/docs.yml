name: 公开文档检查

on:
  push:
    paths:
      - '*.md'
      - 'LICENSE*'
      - 'assets/guide/**'
      - 'assets/readme/**'
      - '.github/**'
      - 'scripts/check_public_docs.py'
  pull_request:
    paths:
      - '*.md'
      - 'LICENSE*'
      - 'assets/guide/**'
      - 'assets/readme/**'
      - '.github/**'
      - 'scripts/check_public_docs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 检查公开文档本地链接
        run: python3 scripts/check_public_docs.py
