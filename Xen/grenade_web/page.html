<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<title>Xen · OBS 道具菜单</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color-scheme:dark;color:#fff;background:#181818;--accent:#3a83f7;--muted:#b4b4bc;--line:#35363c;font-size:14px}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}html{scrollbar-width:thin;scrollbar-color:#555 #181818}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.hidden{display:none!important}
.app{height:100vh;border:1px solid #45464a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#181818}
.top{height:40px;flex:none;padding:0 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:650}.brand span{font-size:13px;font-weight:400;color:var(--muted);margin-left:7px}.tag{font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;flex:none;border-bottom:1px solid var(--line)}.game-state{display:flex;flex:1;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}.game-state strong{font-size:15px;min-width:0;overflow-wrap:anywhere;line-height:1.4}.game-state span{font-size:11px;color:var(--muted)}.tabs{display:flex;flex:none;width:176px;padding:3px;background:#242428;border-radius:8px}.tabs button{width:50%;padding:5px 0;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:13px}.tabs button.active{background:#34445e;color:#c9dfff;font-weight:600}
.workspace{display:flex;min-height:0;flex:1}.workspace #catalog,.workspace #catalog.hidden{display:block!important;width:clamp(208px,22vw,264px);flex:none;border-right:1px solid var(--line);overflow:auto}.list-label{display:flex;justify-content:space-between;gap:5px;padding:12px 12px 6px;font-size:11px;color:var(--muted)}.list{padding:0 8px}.group{width:100%;padding:13px 8px;display:flex;align-items:flex-start;justify-content:space-between;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);gap:8px}.group strong{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.5;white-space:normal;overflow-wrap:anywhere}.group span{flex:none;font-size:11px;line-height:1.9;color:var(--muted);white-space:nowrap}.group b{font-size:16px;font-weight:400;margin-left:5px}.group:hover{background:#242428}
.detail{flex:1;min-width:0;overflow:auto;padding:12px 16px}.back{display:none}.detail h1{font-size:18px;font-weight:600;line-height:1.45;overflow-wrap:anywhere;margin:0 0 10px}.detail-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:18px}.detail-body>div{min-width:0}.section{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:5px;margin:0 0 8px;font-size:13px;font-weight:600;overflow-wrap:anywhere}.section strong{min-width:0}.section span{font-size:11px;font-weight:400;color:var(--muted)}.hint{font-size:12px;line-height:1.5;overflow-wrap:anywhere;color:var(--muted);margin:8px 0}
.reference{position:relative;overflow:hidden;border-radius:7px;background:#242428;min-height:48px}.reference img,.reference>svg{display:block;width:100%;height:auto}.reference img+svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.placeholder{display:flex;align-items:center;justify-content:center;min-height:100px;height:100%;padding:12px;font-size:12px;line-height:1.5;text-align:center;overflow-wrap:anywhere;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:0;background:#242428;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;min-width:0}.card:hover{border-color:#7b7e87}.card.selected{background:#243653;border-color:var(--accent)}.card.pending{border-color:#7ca9e8}.card .reference{border-radius:0;aspect-ratio:1;min-height:80px}.card-copy{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:10px}.card-title{font-size:14px;font-weight:600;line-height:1.45;white-space:normal;overflow-wrap:anywhere}.card-state{font-size:11px;line-height:1.4;color:var(--muted);white-space:normal;overflow-wrap:anywhere}.card.selected .card-state{color:#c9dfff}
.empty{padding:24px 8px;text-align:center;font-size:12px;line-height:1.7;overflow-wrap:anywhere;color:var(--muted)}.welcome{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:16px}.actions{flex:none;width:100%;min-height:42px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 16px;padding:9px 16px;background:#181818;border-top:1px solid var(--line);border-radius:0 0 12px 12px;font-size:12px}.actions #action-note{flex:1 1 300px;line-height:1.45;overflow-wrap:anywhere;white-space:normal;min-width:0}.actions small{font-size:11px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:900px){.workspace #catalog,.workspace #catalog.hidden{width:clamp(176px,24vw,224px)}.detail-body{grid-template-columns:minmax(0,1fr);gap:14px}}
@media(max-width:680px){.game-state span{display:none}.workspace #catalog,.workspace #catalog.hidden{width:clamp(140px,28vw,188px)}.detail{padding:8px 10px}.section span{display:none}.card-copy{padding:8px}.actions{padding:8px 10px}.list-label #group-hint{display:none}}
</style>
<main class="app">
  <header class="top"><div class="brand">Xen<span>道具</span></div><span class="tag">右键 / Esc 收起</span></header>
  <div class="controls"><div class="game-state" aria-live="polite"><strong id="game-state">等待游戏状态</strong><span id="sync-state">GSI 未同步</span></div><div class="tabs"><button id="by-station" class="active">按站位</button><button id="by-target">按落点</button></div></div>
  <div class="workspace"><section id="catalog"><div class="list-label"><span id="count">等待同步</span><span id="group-hint">先选站位</span></div><div id="list" class="list"></div></section>
  <section id="details" class="detail hidden"><button class="back" id="back">‹ 返回</button><h1 id="title"></h1><div class="detail-body"><div id="standing-block"><div class="section">站位图<span id="standing-label">先站到这里</span></div><div id="standing" class="reference"></div><p class="hint" id="standing-note"></p></div><div><div class="section"><strong id="cards-title">选择瞄点</strong><span>点选后返回游戏</span></div><div id="cards" class="cards"></div><p class="hint" id="reference-note">PgDn 采集后会自动更新。</p></div></div></section><div id="welcome" class="welcome">从左侧选择站位或落点</div></div>
  <div class="actions"><div id="action-note">先选站位，再点选瞄点</div><small>↑ 找点 · ↓ 投掷 · ← 取消 · PgDn 采集</small></div>
</main>
<script>
const state={plans:[],catalogLoaded:false,catalogError:false,map:'',team:'',contextKey:'',serviceGeneration:'',deadline:0,generation:0,
  mode:'station',group:null,plan:null,selected:null,pending:null,refs:new Map(),referenceLoading:false,groupSignature:''};
const $=id=>document.getElementById(id);
const mapNames={de_mirage:'Mirage',de_dust2:'Dust II',de_inferno:'Inferno',de_ancient:'Ancient',de_anubis:'Anubis',de_nuke:'Nuke',de_vertigo:'Vertigo',de_train:'Train',de_cache:'Cache',de_overpass:'Overpass',cs_office:'Office',cs_italy:'Italy',ar_baggage:'Baggage',ar_shoots:'Shoots',ar_pool_day:'Pool Day'};
const escapeText=text=>String(text).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function title(plan){
  let name=plan.name.trim();
  const prefixes=[mapNames[plan.map],plan.map,plan.map.replace(/^(?:de|cs|ar)_/,'')].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const prefix of prefixes)if(name.toLowerCase().startsWith(prefix.toLowerCase())&&/\s/.test(name.charAt(prefix.length))){name=name.slice(prefix.length).trimStart();break;}
  return name.replace(/\s+R\d+$/,'').trimEnd();
}
function station(plan){
  const token=title(plan).split(/\s+/,1)[0];
  const match=/^(CT|T)(?:来源)?(\d+)(?:号)?$/.exec(token);
  return match?{key:match[1]+match[2],label:match[2]+'号位',number:Number(match[2])}:{key:token,label:token,number:0};
}
function target(plan){const name=title(plan),space=name.search(/\s/);return space<0?name:name.slice(space).trimStart()||name;}
function ready(){return Boolean(state.map&&state.team&&performance.now()<state.deadline);}
function visiblePlans(){return ready()?state.plans.filter(plan=>plan.map===state.map&&plan.team===state.team).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN',{numeric:true})):[];}
function findPlan(id){return visiblePlans().find(plan=>plan.id===id)||null;}
function groupKey(plan){return state.mode==='station'?station(plan).key:target(plan);}
function groupPlans(){return state.group?visiblePlans().filter(plan=>groupKey(plan)===state.group):[];}
function sharedSpawn(plan){return state.map==='de_mirage'&&state.team==='T'&&station(plan).number>=1&&station(plan).number<=5;}
function groups(){const values=new Map();for(const plan of visiblePlans()){const key=groupKey(plan);if(!values.has(key))values.set(key,{key,label:state.mode==='station'?station(plan).label:target(plan),plans:[]});values.get(key).plans.push(plan);}return [...values.values()];}
function render(){
  $('game-state').textContent=state.map?(mapNames[state.map]||state.map)+(state.team?' · '+state.team:''):'等待游戏状态';
  $('sync-state').textContent=!state.map?'GSI 未同步':state.team?'GSI 已同步':'等待本地阵营';
  $('by-station').classList.toggle('active',state.mode==='station');$('by-target').classList.toggle('active',state.mode==='target');
  $('group-hint').textContent=state.mode==='station'?'先选站位':'先选落点';
  const values=groups();
  $('count').textContent=ready()?values.length+(state.mode==='station'?' 个站位':' 个落点'):'等待同步';
  $('list').innerHTML=!ready()?'<div class="empty">进入游戏后自动同步地图与阵营</div>':state.catalogError?'<div class="empty">暂时无法读取方案，请刷新页面。</div>':!state.catalogLoaded?'<div class="empty">正在读取方案…</div>':values.length?values.map(group=>`<button class="group" data-group="${escapeText(group.key)}"><strong>${escapeText(group.label)}</strong><span>${group.plans.length} 套道具<b>›</b></span></button>`).join(''):'<div class="empty">这个阵营还没有已保存的方案</div>';
  const plans=groupPlans();if(state.group&&!plans.length)state.group=null;
  $('catalog').classList.toggle('hidden',Boolean(state.group));$('details').classList.toggle('hidden',!state.group);$('welcome').classList.toggle('hidden',Boolean(state.group));
  if(!state.group){state.groupSignature='';return;}
  const label=state.mode==='station'?station(plans[0]).label:state.group;
  $('title').textContent=label;$('back').textContent=state.mode==='station'?'‹ 全部站位':'‹ 全部落点';
  $('cards-title').textContent=state.mode==='station'?'选择瞄点':'选择站位';
  const signature=JSON.stringify([state.mode,state.group,plans.map(plan=>plan.id)]);
  if(signature!==state.groupSignature){state.groupSignature=signature;$('standing').replaceChildren();$('standing').dataset.revision='';
    $('cards').innerHTML=plans.map(plan=>`<button class="card" data-id="${escapeText(plan.id)}"><div class="reference" data-image="${escapeText(plan.id)}"><span class="placeholder">正在读取瞄点…</span></div><div class="card-copy"><span class="card-title">${escapeText(state.mode==='station'?target(plan):station(plan).label)}</span><span class="card-state">点选</span></div></button>`).join('');}
  updateChoice();renderImages();
}
function updateChoice(){for(const card of $('cards').querySelectorAll('[data-id]')){const pending=state.pending?.planId===card.dataset.id,selected=state.selected===card.dataset.id;card.classList.toggle('selected',selected);card.classList.toggle('pending',pending);card.querySelector('.card-state').textContent=pending?'载入中':selected?'已选中':'点选';card.disabled=Boolean(state.pending);}}
function showGroup(key,push=true){if(!groups().some(group=>group.key===key))return;state.group=key;render();if(push)history.pushState({group:key,mode:state.mode,generation:state.generation},'','#group');window.scrollTo(0,0);refreshReferences();}
function resetSelection(){state.generation++;state.group=null;state.plan=null;state.selected=null;state.pending=null;state.refs.clear();state.referenceLoading=false;state.groupSignature='';$('action-note').textContent='先选站位，再点选瞄点';history.replaceState(null,'',location.pathname);}
let expiryTimer;
function clearContext(){clearTimeout(expiryTimer);if(state.contextKey||state.group||state.selected)resetSelection();state.map='';state.team='';state.contextKey='';state.serviceGeneration='';state.deadline=0;render();}
function validIdentity(value){return(typeof value==='string'&&value.length>0&&value.length<=128&&!/[\u0000-\u001f\u007f]/.test(value))||(Number.isSafeInteger(value)&&value>=0);}
function applyContext(value,started){
  if(!value||value.valid!==true){clearContext();return;}
  if(typeof value.map!=='string'||!value.map||value.map.length>256||!['T','CT',''].includes(value.team)||!validIdentity(value.epoch)||!validIdentity(value.generation)||!Number.isInteger(value.remaining_ms)||value.remaining_ms<=0||value.remaining_ms>10000)throw Error('状态字段无效');
  const now=performance.now(),deadline=started+value.remaining_ms;if(!Number.isFinite(started)||started>now||deadline<=now){clearContext();return;}
  const key=JSON.stringify([value.map,value.team,String(value.epoch),String(value.generation)]),changed=key!==state.contextKey||state.deadline<=now;
  if(changed)resetSelection();state.map=value.map;state.team=value.team;state.contextKey=key;state.serviceGeneration=String(value.generation);state.deadline=deadline;
  clearTimeout(expiryTimer);expiryTimer=setTimeout(clearContext,deadline-now);if(changed)render();
}
$('list').addEventListener('click',event=>{const row=event.target.closest('[data-group]');if(row)showGroup(row.dataset.group);});
$('cards').addEventListener('click',event=>{const card=event.target.closest('[data-id]');if(card)selectPlan(card.dataset.id);});
$('back').addEventListener('click',()=>history.back());
for(const mode of ['station','target'])$('by-'+mode).addEventListener('click',()=>{state.mode=mode;state.group=null;state.groupSignature='';history.replaceState(null,'',location.pathname);render();});
window.addEventListener('popstate',event=>{if(event.state?.group&&event.state.generation===state.generation){state.mode=event.state.mode;showGroup(event.state.group,false);}else{state.group=null;render();history.replaceState(null,'',location.pathname);}});
async function selectPlan(planId){
  const plan=findPlan(planId);if(!plan||state.pending)return;state.plan=plan;const generation=state.generation;state.pending={planId,requestId:''};updateChoice();$('action-note').textContent='正在载入 '+title(plan)+'…';
  try{const response=await fetch('/select.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan_id:planId,generation:state.serviceGeneration}),signal:AbortSignal.timeout(3000)});const result=await response.json();if(generation!==state.generation)return;if(!response.ok||result.state!=='pending'||typeof result.request_id!=='string')throw Error(result.reason||'方案选择未完成');state.pending={planId,requestId:result.request_id};}
  catch(error){if(generation!==state.generation)return;state.pending=null;$('action-note').textContent=error.message||'连接未完成，请重新选择';updateChoice();}
}
function imageUrl(kind,id,revision){return '/reference/'+kind+'.png?plan_id='+encodeURIComponent(id)+'&revision='+encodeURIComponent(revision);}
function svgElement(tag,attributes){const item=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[name,value]of Object.entries(attributes))item.setAttribute(name,String(value));return item;}
function imageReady(value,kind){return (value?.[kind+'_ready']??value?.ready)===true;}
function renderAim(container,plan,value){
  const revision=imageReady(value,'aim')?value.revision:'missing';if(container.dataset.revision===revision)return;container.dataset.revision=revision;
  if(!imageReady(value,'aim')){container.innerHTML='<span class="placeholder">瞄点待采集</span>';return;}
  const g=value.geometry,width=Math.min(g.source_width,g.roi_width*g.scale_x*2),height=Math.min(g.source_height,g.roi_height*g.scale_y*2);
  const x=Math.max(0,Math.min(g.source_width-width,g.roi_x+g.roi_width*g.scale_x/2-width/2)),y=Math.max(0,Math.min(g.source_height-height,g.roi_y+g.roi_height*g.scale_y/2-height/2));
  const svg=svgElement('svg',{viewBox:`${x} ${y} ${width} ${height}`,role:'img','aria-label':target(plan)+'瞄点'});
  const image=svgElement('image',{href:imageUrl('aim',plan.id,value.revision),x:0,y:0,width:g.source_width,height:g.source_height});
  image.addEventListener('error',()=>{container.dataset.revision='';container.innerHTML='<span class="placeholder">图片读取失败，稍后重试</span>';});
  svg.append(image,svgElement('rect',{x:g.roi_x,y:g.roi_y,width:g.roi_width*g.scale_x,height:g.roi_height*g.scale_y,fill:'none',stroke:'#ffdf36','stroke-width':width*.005}),svgElement('circle',{cx:g.roi_x+value.target_x*g.scale_x,cy:g.roi_y+value.target_y*g.scale_y,r:width*.009,fill:'#ffdf36',stroke:'#23342b','stroke-width':width*.002}));container.replaceChildren(svg);
}
function standingSource(){
  const plans=groupPlans(),chosen=plans.find(plan=>plan.id===state.selected);
  // 按落点可能列出不同站位；未选或所选缺图时不能借用另一站位的图片。
  const candidates=state.mode==='target'?(chosen?[chosen]:plans.length===1?plans:[]):chosen?[chosen,...plans.filter(plan=>plan!==chosen)]:plans;
  const own=candidates.find(plan=>imageReady(state.refs.get(plan.id),'standing'));if(own)return own;
  if(candidates.length&&candidates.every(sharedSpawn))return visiblePlans().find(plan=>sharedSpawn(plan)&&imageReady(state.refs.get(plan.id),'standing')&&state.refs.get(plan.id).standing_marker)||null;
  return null;
}
function renderImages(){
  const plans=groupPlans();if(!plans.length)return;
  for(const container of $('cards').querySelectorAll('[data-image]')){const plan=plans.find(item=>item.id===container.dataset.image);if(plan)renderAim(container,plan,state.refs.get(plan.id));}
  const source=standingSource(),shared=plans.every(sharedSpawn)&&Boolean(state.refs.get(source?.id)?.standing_marker),container=$('standing');$('standing-label').textContent=shared?'出生点共用一张图':'先站到这里';
  if(!source){if(container.dataset.revision!=='missing'){container.innerHTML='<div class="placeholder">站位图待采集</div>';container.dataset.revision='missing';}$('standing-note').textContent='PgUp 采集站位图后会自动显示。';return;}
  const value=state.refs.get(source.id),marker=state.mode==='station'&&station(source).key===state.group?value.standing_marker:null;
  const revision=value.revision+':'+(marker?state.group:'shared');if(container.dataset.revision!==revision){container.dataset.revision=revision;const image=document.createElement('img');image.alt='站位图';image.src=imageUrl('standing',source.id,value.revision);image.onerror=()=>{container.dataset.revision='';container.innerHTML='<span class="placeholder">图片读取失败，稍后重试</span>';};const svg=svgElement('svg',{viewBox:`0 0 ${value.standing_width} ${value.standing_height}`});if(marker)svg.append(svgElement('circle',{cx:marker.x*value.standing_width,cy:marker.y*value.standing_height,r:value.standing_width*.026,fill:'none',stroke:'#ffdf36','stroke-width':value.standing_width*.006}));container.replaceChildren(image,svg);}
  $('standing-note').textContent=shared?'1–5 号位共用出生点图，按图中编号站位。':value.standing_note||'按图站好位置。';
}
async function refreshReferences(){
  if(state.referenceLoading||!ready()||!state.group||document.hidden)return;state.referenceLoading=true;const generation=state.generation,group=state.group,mode=state.mode;
  const fetchOne=async plan=>{try{const response=await fetch('/reference.json?plan_id='+encodeURIComponent(plan.id),{cache:'no-store',signal:AbortSignal.timeout(4000)});const value=await response.json();if(generation!==state.generation)return;const previous=state.refs.get(plan.id);state.refs.set(plan.id,response.ok&&(imageReady(value,'aim')||imageReady(value,'standing'))?value:{ready:false});if(previous?.revision&&value.revision&&previous.revision!==value.revision)$('reference-note').textContent='新截图已同步。PgUp 更新站位，PgDn 更新瞄点。';}catch{if(generation===state.generation)state.refs.set(plan.id,{ready:false});}};
  try{const wanted=groupPlans();for(const extra of [findPlan(state.selected),standingSource()])if(extra&&!wanted.some(plan=>plan.id===extra.id))wanted.push(extra);
    for(const plan of wanted){await fetchOne(plan);if(generation!==state.generation||group!==state.group||mode!==state.mode)return;renderImages();}
    const plans=groupPlans();if(plans.length&&plans.every(sharedSpawn)&&!standingSource()){for(const plan of visiblePlans().filter(sharedSpawn)){if(plans.some(item=>item.id===plan.id))continue;await fetchOne(plan);if(generation!==state.generation||group!==state.group||mode!==state.mode)return;if(standingSource()){renderImages();break;}}}}
  finally{if(generation===state.generation)state.referenceLoading=false;}
}
function applySelection(value){if(!value||value.generation!==state.serviceGeneration)return;const waiting=Boolean(state.pending);
  if(state.pending&&value.request_id===state.pending.requestId&&value.state!=='pending'){state.selected=value.state==='selected'?value.plan_id:null;state.pending=null;$('action-note').textContent=value.state==='selected'?'已选中 '+title(findPlan(value.plan_id)||{name:value.plan_id,map:state.map}):value.reason||'选择未完成';updateChoice();renderImages();}
  if(!waiting){const selected=typeof value.actual_plan_id==='string'?findPlan(value.actual_plan_id)?.id||null:null;if(selected!==state.selected){state.selected=selected;if(selected)state.plan=findPlan(selected);updateChoice();renderImages();}}
  const guidance=value.guidance;if(state.selected&&guidance?.plan_id===state.selected&&guidance.message)$('action-note').textContent=guidance.message;
}
window.addEventListener('pageshow',event=>{if(event.persisted)clearContext();});document.addEventListener('visibilitychange',()=>{if(document.hidden||performance.now()>=state.deadline)clearContext();});
async function pollContext(){const started=performance.now(),abort=new AbortController();const timeout=setTimeout(()=>{clearContext();abort.abort();},2000);try{const response=await fetch('/context.json',{cache:'no-store',signal:abort.signal});if(!response.ok)throw Error('读取状态失败');const value=await response.json();if(abort.signal.aborted)throw Error('读取状态超时');applyContext(value,started);if(ready()){const selection=await fetch('/selection.json',{cache:'no-store',signal:abort.signal});if(selection.ok)applySelection(await selection.json());}}catch{clearContext();}finally{clearTimeout(timeout);setTimeout(pollContext,Math.max(0,500-(performance.now()-started)));}}
history.replaceState(null,'',location.pathname);render();pollContext();setInterval(refreshReferences,1500);
fetch('/catalog.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('读取清单失败');return response.json();}).then(data=>{if(!Array.isArray(data)||data.some(plan=>!plan||typeof plan.id!=='string'||typeof plan.name!=='string'||typeof plan.map!=='string'||!['T','CT',''].includes(plan.team)))throw Error('清单字段无效');state.plans=data;state.catalogLoaded=true;render();}).catch(()=>{state.catalogError=true;clearContext();});
</script>
