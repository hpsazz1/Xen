<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
<title id="title">Xen 项目架构</title><desc id="desc">原生控制台和配置、上下文共同服务 Runtime；采集、检测、瞄准及辅助控制经安全协调送往输入后端。素材与预测进入审核训练，候选模型需用户手动采用。运行记录用于离线诊断。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#58816f"/></marker><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#668cae"/></marker></defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#173c35} .heading{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#536e61}.module{font-size:18px;fill:#58786b}.node{fill:white;stroke:#bfd4c7;stroke-width:1.5}.flow{fill:none;stroke:#58816f;stroke-width:2.4;marker-end:url(#arrow)}.support{fill:none;stroke:#668cae;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#blueArrow)}</style>
<rect width="1160" height="680" rx="16" fill="#f5f8f3"/>
<!-- 配置与状态入口 -->
<rect class="node" x="32" y="24" width="555" height="105" rx="10"/>
<text class="heading" x="52" y="55">原生控制台与配置</text><text class="module" x="52" y="82">Overlay / Config</text><text class="small" x="52" y="109">配置与模型选择 · 作业操作 · 运行快照展示</text>
<rect x="619" y="24" width="509" height="105" rx="10" fill="#edf3f9" stroke="#c7d8e7"/>
<text class="heading" x="640" y="55">输入与游戏上下文</text><text class="body" x="640" y="84">热键 / GSI / 源端焦点与时钟</text><text class="small" x="640" y="110">提供状态与许可条件</text>
<path class="support" d="M300 129 V155"/><path class="support" d="M810 129 V155"/>
<!-- Runtime 的主要流程 -->
<rect x="24" y="156" width="880" height="304" rx="12" fill="#eaf2e8" stroke="#a9c7b5" stroke-width="1.5"/>
<text class="heading" x="44" y="188">Runtime</text><text class="body" x="165" y="188">生命周期 · 队列 · 运行状态</text>
<rect class="node" x="44" y="216" width="158" height="105" rx="8"/>
<text class="heading" x="62" y="249">画面采集</text><text class="module" x="62" y="276">Capture</text><text class="small" x="62" y="303">本机 / 双机源</text>
<rect class="node" x="240" y="216" width="178" height="105" rx="8"/>
<text class="heading" x="259" y="249">模型检测</text><text class="module" x="259" y="276">Detector</text><text class="small" x="259" y="303">ONNX Runtime</text>
<rect class="node" x="458" y="216" width="210" height="105" rx="8"/>
<text class="heading" x="478" y="249">瞄准控制 · Aim</text><text class="body" x="478" y="278">追踪与目标选择</text><text class="small" x="478" y="303">生成控制请求</text>
<rect class="node" x="706" y="216" width="174" height="105" rx="8"/>
<text class="heading" x="724" y="249">安全输出协调</text><text class="module" x="724" y="276">SafetyGate</text><text class="small" x="724" y="303">许可与清理</text>
<path class="flow" d="M202 264 H237"/><path class="flow" d="M418 264 H455"/><path class="flow" d="M668 264 H703"/>
<rect class="node" x="458" y="357" width="210" height="78" rx="8"/>
<text class="heading" x="478" y="387">辅助控制</text><text class="small" x="478" y="410">身法 / 扳机</text><text class="small" x="478" y="431">急停 / 弹道</text>
<path class="support" d="M329 321 V396 H455"/><text class="small" x="343" y="378">目标观测</text>
<path class="flow" d="M668 396 H793 V324"/>
<!-- 设备输出和诊断独立于图像链 -->
<rect x="942" y="216" width="186" height="122" rx="8" fill="#edf3f9" stroke="#b8cee0"/>
<text class="heading" x="960" y="248">设备输出</text><text class="module" x="960" y="275">Mouse / Input</text><text class="small" x="960" y="302">SendInput</text><text class="small" x="950" y="325">KMBOX NET / MAKCU</text>
<path class="flow" d="M880 264 H939"/>
<rect x="942" y="378" width="186" height="183" rx="8" fill="#edf3f9" stroke="#b8cee0"/>
<text class="heading" x="960" y="411">诊断与复盘</text><text class="module" x="960" y="442">Debug / Log</text><text class="body" x="960" y="479">运行报告</text><text class="body" x="960" y="509">原始记录归档</text><text class="small" x="960" y="541">离线分析与对照</text>
<path class="support" d="M904 421 H939"/>
<!-- 数据工作流；候选采用用说明代替跨图回路 -->
<path d="M275 321 V343 H124" fill="none" stroke="#668cae" stroke-width="2" stroke-dasharray="6 5"/><path class="support" d="M124 321 V510"/><text class="small" x="145" y="488">原图与预测</text>
<rect class="node" x="32" y="513" width="226" height="106" rx="8"/>
<text class="heading" x="51" y="548">素材与预测归档</text><text class="module" x="51" y="577">Data Collector</text><text class="small" x="51" y="603">按需采集</text>
<rect class="node" x="302" y="513" width="370" height="106" rx="8"/>
<text class="heading" x="323" y="548">审核 → 数据集 → 训练与评价</text><text class="module" x="323" y="577">Model Workspace</text><text class="small" x="323" y="603">人工审核 · 独立评价</text>
<rect class="node" x="716" y="513" width="187" height="106" rx="8"/>
<text class="heading" x="736" y="548">候选模型</text><text class="module" x="736" y="577">ONNX</text><text class="small" x="736" y="603">保留原模型</text>
<path class="flow" d="M258 564 H299"/><path class="flow" d="M672 564 H713"/>
<text class="body" x="32" y="656">候选模型由用户显式导入和选择，不自动替换现用模型。</text>
<text class="small" x="820" y="656">职责与数据流 ≠ 固定线程数</text>
</svg>
